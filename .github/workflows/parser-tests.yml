
name: JeeLink Parser Tests

on:
  push:
    branches:
      - main
    paths:
      - "tests/**"
      - ".github/workflows/parser-tests.yml"
  pull_request:
    paths:
      - "tests/**"
      - ".github/workflows/parser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-tests:
    name: Python Parser Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pylacrosse>=0.4"

      - name: Run JeeLink parser tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v
